<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
  <rect width="1200" height="630" fill="#011207"/>

  <!-- Clapperboard icon in its rounded tile -->
  <svg x="70" y="145" width="340" height="340" viewBox="0 0 1024 1024">
    <defs>
      <pattern id="teeth" width="128" height="260" patternUnits="userSpaceOnUse">
        <rect width="128" height="260" fill="#011207"/>
        <polygon points="46,0 112,0 66,260 0,260" fill="#E2F0CC"/>
      </pattern>
      <clipPath id="tile"><rect width="1024" height="1024" rx="230"/></clipPath>
    </defs>
    <g clip-path="url(#tile)">
      <rect width="1024" height="1024" fill="#012F13"/>
      <rect x="150" y="470" width="724" height="372" rx="34" fill="#011207"/>
      <line x1="222" y1="572" x2="802" y2="572" stroke="#0C3D1C" stroke-width="18" stroke-linecap="round"/>
      <line x1="222" y1="660" x2="690" y2="660" stroke="#0C3D1C" stroke-width="18" stroke-linecap="round"/>
      <line x1="222" y1="748" x2="600" y2="748" stroke="#0C3D1C" stroke-width="18" stroke-linecap="round"/>
      <circle cx="792" cy="748" r="52" fill="#8BC53D"/>
      <g transform="rotate(-16 214 432)">
        <rect x="150" y="330" width="772" height="176" rx="26" fill="url(#teeth)"/>
      </g>
      <circle cx="214" cy="432" r="30" fill="#8BC53D"/>
    </g>
    <rect x="6" y="6" width="1012" height="1012" rx="226" fill="none" stroke="#0C3D1C" stroke-width="4"/>
  </svg>

  <!-- Wordmark -->
  <text x="452" y="315" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="130" fill="#E2F0CC" letter-spacing="-2">Clapper</text>
  <!-- Green accent bar -->
  <rect x="456" y="350" width="150" height="12" rx="6" fill="#8BC53D"/>
  <!-- Tagline -->
  <text x="456" y="430" font-family="Helvetica, Arial, sans-serif" font-weight="400" font-size="36" fill="#9DB59A">Free take logger + continuity/TCR sheets</text>
</svg>
