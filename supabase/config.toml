# Per-function gateway settings, declared here rather than passed as
# `--no-verify-jwt` on the command line: the flag is a property of the
# function, not of whoever happened to type the deploy, and a redeploy that
# forgets it silently 401s every event Stripe sends.

project_id = "sqqdivfgdfaztfzrzkhu"

# STRIPE IS NOT A SUPABASE USER. It has no anon key and no JWT, so the gateway
# must let its POSTs through untouched. That makes the Stripe-Signature check
# inside the function THE authentication - there is no second gate behind it.
# See the header of stripe-webhook/index.ts.
[functions.stripe-webhook]
verify_jwt = false

# Called by the app with a real user session, so the gateway checks the JWT
# and the function can trust `sub` as the buyer. Deliberately the opposite of
# the webhook above.
[functions.stripe-checkout]
verify_jwt = true

# RAZORPAY. Added 2026-08-27, AFTER the first real live payment took ₹1 and
# granted nothing. razorpay-webhook/index.ts's own header said this flag was
# required and this file never grew the entry, so the function shipped with
# the gateway default (verify_jwt = true) and every delivery Razorpay made
# was refused before a line of our code ran:
#
#   HTTP 401 {"code":"UNAUTHORIZED_NO_AUTH_HEADER"}
#
# That is the Supabase gateway answering, not the function - which is exactly
# why it was invisible from our side: no function log, no ledger row, no
# failed grant to find. Razorpay is not a Supabase user and never sends an
# Authorization header, so this MUST stay false and the signature check
# inside the function remains the only authentication.
[functions.razorpay-webhook]
verify_jwt = false

# Both called by the app with a real user session - the gateway checks the
# JWT and the function trusts `sub` as the buyer. razorpay-order in
# particular writes notes.user_id from that claim, so a forged body cannot
# buy credits for somebody else's account.
[functions.razorpay-order]
verify_jwt = true

[functions.razorpay-verify]
verify_jwt = true

# The recurring counterpart to razorpay-order, added 2026-08-27. Same posture:
# called by the app with a real user session, so the gateway checks the JWT and
# the function trusts `sub` as the subscriber.
[functions.razorpay-subscription]
verify_jwt = true

# Display only: how many launch-offer slots are left. verify_jwt stays TRUE
# even though it answers signed-out callers, because supabase-js sends the
# anon key as the Authorization header either way - the gateway is satisfied
# by the anon key and the function itself sees no user, which is exactly the
# distinction it wants. It grants nothing and takes no money.
[functions.promo-status]
verify_jwt = true

# ---------------------------------------------------------------------------
# EVERY DEPLOYED FUNCTION NEEDS AN ENTRY HERE, INCLUDING THE ONES NOBODY IS
# CURRENTLY EDITING. Added 2026-08-27 after finding four live functions with no
# declaration at all. The CLI defaults an undeclared function to verify_jwt =
# true, so the next person who redeploys `breakdown` or `export-gate` without
# touching this file flips them from false to true and the gateway starts
# 401ing before the function runs. That is the same failure that already cost
# this project a real payment, and it leaves no function log to find it by.
# The values below are what production ACTUALLY had when this was written,
# read back from the deployed function list, not what anyone assumed.

# Script Mode's shot-division parse. Runs on the anon key and does its own
# auth and quota work inside the function.
[functions.breakdown]
verify_jwt = false

# The export wall. Same posture as breakdown: reached on the anon key, decides
# for itself who is asking and whether the project is unlocked.
[functions.export-gate]
verify_jwt = false

# The owner's private analytics dashboard. The page sends the anon key as the
# Authorization header, so the gateway is satisfied by that; the passphrase is
# a separate app-level identity the gateway never sees.
[functions.dashboard-api]
verify_jwt = true

# Not in use, kept so a redeploy cannot silently change its posture.
[functions.paddle-webhook]
verify_jwt = false
