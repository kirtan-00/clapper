<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<!-- Not linked from anywhere in the product, and the path is guessable (this
     is a public repo) - which is exactly why every number on this page comes
     from supabase/functions/dashboard-api, gated by a passphrase compared in
     constant time, an escalating cooldown, and a hard lockout, all enforced
     server-side. Nothing in THIS file is a secret: no service-role key, no
     passphrase, no anon-key-shaped identity. See that function's header
     comment for the full auth design. -->
<meta name="theme-color" content="#000000" />
<script>
  // Pre-paint theme read, own key, own default - NIGHT here, unlike the app
  // (src/ui/theme.ts), which defaults to day. This page is read by one
  // person, usually at odd hours, and "night-first" was an explicit
  // instruction for this build - see feedback_clapper_theme_locked.md. Kept
  // as its OWN storage key rather than reading 'clapper.theme': that key only
  // ever holds 'night' or is absent, and absent means "never touched the
  // app's toggle", not "wants ivory here". A dedicated key with its own
  // explicit day/night values is the only way to store an actual preference
  // for THIS page. Storage can throw (Safari private mode); night stays the
  // default either way, which the markup already is.
  (function () {
    try {
      if (localStorage.getItem('clapper.dashboard.theme') === 'day') {
        document.documentElement.setAttribute('data-theme', 'day');
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', '#fbfaf7');
      }
    } catch (e) { /* night stays the default */ }
  })();
</script>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<title>Clapper - Mission Control</title>
<style>
/* ============================================================================
   TOKENS. Palette is LOCKED, night-first: true-black ground, acid-yellow
   accent (#e6ff2b), ivory day variant. No green, no purple, no gradients, no
   3D - see feedback_clapper_theme_locked.md.

   The night values below are copied by hand from src/styles.css's own
   [data-theme="night"] block (exact hex, not eyeballed): --paper #000000,
   --paper-raised #161616, --paper-sunk #0e0e0e, --ink #ece9e1, --ink-dim
   #999793, --ink-faint #615f5b, --rule #262626, the accent #e6ff2b / press
   #c9e024 / ink-on-fill #000000, and --rec #ff3b30 for danger.

   THE DAY VARIANT DOES NOT COME FROM THE CURRENT src/styles.css :root BLOCK.
   That block is a pale-green day theme ("day moved onto it wholesale" per
   its own second-pass comment) - the opposite of "no green, ivory day"
   below. It comes from THIS PROJECT'S OWN earlier ivory theme instead
   (commit a42214e, before the green repaint): --paper #fbfaf7, --paper-raised
   #ffffff, --paper-sunk #f2f0ea, --ink #14151a, --ink-dim #5a5e68,
   --ink-faint #7c808a, --rule #ddd9d0. Still an exact value lifted from this
   codebase, just from the ivory pass rather than the green one, because the
   instruction for this build ranks above the live file's second pass.
   Spacing/radius/type/motion tokens below ARE identical between both passes
   of styles.css, so those are copied straight from the live file. ========= */
:root {
  --paper: #000000;
  --paper-raised: #161616;
  --paper-sunk: #0e0e0e;
  --ink: #ece9e1;
  --ink-dim: #999793;
  --ink-faint: #615f5b;
  --rule: #262626;

  --accent: #e6ff2b;
  --accent-press: #c9e024;
  --accent-ink: #000000;
  --accent-text: #e6ff2b;      /* night: bright IS the legible type colour */
  --accent-tint: color-mix(in srgb, #e6ff2b 14%, transparent);

  --danger: #ff3b30;
  --danger-text: #ff3b30;      /* night: bright is legible here too */
  --danger-tint: color-mix(in srgb, #ff3b30 14%, transparent);

  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, "Roboto Mono", monospace;

  --radius-sm: 10px;
  --radius: 14px;
  --radius-lg: 20px;
  --radius-pill: 999px;

  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-7: 32px; --sp-8: 48px;

  --t-caps: 11px; --t-caption: 12px; --t-secondary: 13px;
  --t-body: 16px; --t-row: 17px; --t-title: 20px; --t-display: 28px;

  --tap: 44px;
  --dur-state: 120ms;
  --ease-out: cubic-bezier(0.2, 0.85, 0.25, 1);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

[data-theme="day"] {
  --paper: #fbfaf7;
  --paper-raised: #ffffff;
  --paper-sunk: #f2f0ea;
  --ink: #14151a;
  --ink-dim: #5a5e68;
  --ink-faint: #7c808a;
  --rule: #ddd9d0;

  --accent: #e6ff2b;
  --accent-press: #d8ec1f;
  --accent-ink: #000000;
  --accent-text: #5a6600;      /* day: acid on ivory reads ~1.9:1, so type/
                                   borders use this deep form (5.27:1 on
                                   ivory) - value lifted verbatim from the
                                   live styles.css --brass-text */
  --accent-tint: color-mix(in srgb, #5a6600 8%, transparent);

  --danger: #ff3b30;
  --danger-text: #c0261d;      /* day: same split, live styles.css --rec-text */
  --danger-tint: color-mix(in srgb, #c0261d 8%, transparent);
}

* { box-sizing: border-box; }
html { color-scheme: dark; }
[data-theme="day"] { color-scheme: light; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: var(--t-body)/1.5 var(--font-ui);
  -webkit-font-smoothing: antialiased;
  transition: background var(--dur-state) var(--ease-out), color var(--dur-state) var(--ease-out);
}
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding:
    calc(var(--safe-top) + var(--sp-5))
    var(--sp-4)
    calc(var(--safe-bottom) + var(--sp-8));
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

header.top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--sp-3);
  margin-bottom: var(--sp-6);
  flex-wrap: wrap;
}
header.top h1 {
  font-size: var(--t-title);
  font-weight: 700;
  letter-spacing: -0.01em;
  margin: 0;
}
header.top .sub {
  font-size: var(--t-caption);
  color: var(--ink-dim);
  margin: 2px 0 0;
}
.top-controls { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }
.top-controls[hidden] { display: none; }

/* flat solid-fill buttons - no bevel, no gradient, no lift, matching src/styles.css's .btn rules */
.btn {
  appearance: none;
  min-height: var(--tap);
  padding: 0 var(--sp-5);
  border-radius: var(--radius-sm);
  border: 0;
  box-shadow: inset 0 0 0 1.5px var(--rule);
  background: var(--paper-raised);
  color: var(--ink);
  font: 600 var(--t-row)/1 var(--font-ui);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  cursor: pointer;
  transition: background var(--dur-state) var(--ease-out);
}
.btn:active { background: var(--paper-sunk); }
.btn--primary { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
.btn--primary:active { background: var(--accent-press); }
.btn--full { width: 100%; }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn--sm { min-height: 36px; padding: 0 var(--sp-3); font-size: var(--t-secondary); }
.btn--text {
  background: transparent; box-shadow: none; color: var(--ink-dim);
  font-weight: 600; font-size: var(--t-secondary); min-height: var(--tap); padding: 0 var(--sp-2);
}
.btn--text:active { color: var(--ink); }

.toggle {
  display: inline-flex; align-items: center; gap: var(--sp-2);
  font-size: var(--t-secondary); color: var(--ink-dim); cursor: pointer;
  min-height: var(--tap); padding: 0 var(--sp-1);
}
.toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.toggle .track {
  width: 38px; height: 22px; border-radius: var(--radius-pill);
  background: var(--paper-sunk); box-shadow: inset 0 0 0 1.5px var(--rule);
  position: relative; flex: 0 0 auto; transition: background var(--dur-state) var(--ease-out);
}
.toggle .track::after {
  content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
  border-radius: 50%; background: var(--ink-faint); transition: transform var(--dur-state) var(--ease-out), background var(--dur-state) var(--ease-out);
}
.toggle input:checked + .track { background: var(--accent-tint); box-shadow: inset 0 0 0 1.5px var(--accent-text); }
.toggle input:checked + .track::after { transform: translateX(16px); background: var(--accent-text); }
.toggle .label strong { color: var(--ink); }

.state { flex: 1; display: flex; flex-direction: column; }
.state[hidden] { display: none; }

.center-card {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; gap: var(--sp-5); padding: var(--sp-6) 0;
}
.center-card p.lede { font-size: var(--t-row); color: var(--ink); max-width: 42ch; margin: 0; }
.center-card p.note { font-size: var(--t-secondary); color: var(--ink-dim); max-width: 40ch; margin: 0; }
.center-card .btn { min-width: 240px; }

.mark { display: flex; gap: 3px; width: 64px; height: 18px; }
.mark span { flex: 1; background: var(--ink); border-radius: 2px; }
.mark span:nth-child(2n) { background: var(--accent); }

.field {
  width: 100%; max-width: 320px; min-height: var(--tap); padding: 0 var(--sp-4);
  border-radius: var(--radius-sm); border: 0; box-shadow: inset 0 0 0 1.5px var(--rule);
  background: var(--paper-raised); color: var(--ink); font: 600 var(--t-row)/1 var(--font-mono);
  text-align: center; letter-spacing: 0.04em;
}
.field:focus { outline: 2px solid var(--accent-text); outline-offset: 1px; }
.field::placeholder { color: var(--ink-faint); font-family: var(--font-ui); font-weight: 400; letter-spacing: 0; }

.err-banner {
  background: var(--danger-tint); border-radius: var(--radius-sm); padding: var(--sp-3);
  color: var(--danger-text); font-size: var(--t-secondary); font-weight: 600; margin-top: var(--sp-3);
  max-width: 320px;
}

.banner {
  overflow-wrap: anywhere;
  background: var(--paper-raised); border-radius: var(--radius); box-shadow: inset 0 0 0 1.5px var(--rule);
  padding: var(--sp-4); margin-bottom: var(--sp-4); font-size: var(--t-secondary); color: var(--ink-dim);
}
.banner strong { color: var(--ink); }
.banner .n { color: var(--accent-text); font-weight: 700; }
.banner + .banner { margin-top: calc(-1 * var(--sp-3)); }
.banner ul { margin: var(--sp-2) 0 0; padding-left: 1.1em; }
.banner li { margin: var(--sp-1) 0; }

.card {
  background: var(--paper-raised); border-radius: var(--radius); box-shadow: inset 0 0 0 1.5px var(--rule);
  padding: var(--sp-4) var(--sp-4) var(--sp-5); margin-bottom: var(--sp-4);
}
.card h2 {
  font-size: var(--t-caps); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700;
  color: var(--ink-dim); margin: 0 0 var(--sp-3); display: flex; align-items: center; justify-content: space-between;
}
.card p.foot-note { font-size: var(--t-caption); color: var(--ink-faint); margin: var(--sp-3) 0 0; line-height: 1.5; overflow-wrap: anywhere; }
.card p.foot-note strong { color: var(--ink-dim); }

.stat-row { display: flex; gap: var(--sp-6); flex-wrap: wrap; }
.stat .num { font-size: var(--t-display); font-weight: 700; line-height: 1; }
.stat .label { font-size: var(--t-caption); color: var(--ink-dim); margin-top: var(--sp-1); }

.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); padding: var(--sp-2) 0; border-top: 1.5px solid var(--rule); }
.row:first-child { border-top: 0; }
.row .k { font-size: var(--t-row); color: var(--ink); }
.row .k .sub { display: block; font-size: var(--t-caption); color: var(--ink-dim); font-weight: 400; }
.row .v { font-size: var(--t-row); font-weight: 700; text-align: right; }
.row .v .sub { display: block; font-size: var(--t-caption); color: var(--ink-dim); font-weight: 600; }
.row--sm .k, .row--sm .v { font-size: var(--t-secondary); }

.empty { font-size: var(--t-secondary); color: var(--ink-faint); padding: var(--sp-2) 0; }

/* subsection heading inside a card */
h3.sub-h {
  font-size: var(--t-caption); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700;
  color: var(--ink-faint); margin: var(--sp-5) 0 var(--sp-2);
}
h3.sub-h:first-child { margin-top: 0; }

/* bar chart (SVG) */
.chart-svg { display: block; width: 100%; height: auto; margin-top: var(--sp-3); }
.chart-svg .bar { fill: var(--accent); }
.chart-svg .bar--dim { fill: var(--ink-faint); }
.chart-svg .axis-label { fill: var(--ink-faint); font: 600 9px var(--font-mono); }
.chart-legend { display: flex; gap: var(--sp-4); margin-top: var(--sp-2); font-size: var(--t-caption); color: var(--ink-dim); }
.chart-legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }

/* funnel */
.funnel { display: flex; flex-direction: column; gap: var(--sp-2); margin-top: var(--sp-3); }
.funnel-row { display: flex; flex-direction: column; gap: var(--sp-1); }
.funnel-row .lbl { display: flex; justify-content: space-between; font-size: var(--t-secondary); }
.funnel-row .lbl .name { color: var(--ink); font-weight: 600; }
.funnel-row .lbl .val { color: var(--ink-dim); }
.funnel-track { height: 22px; border-radius: var(--radius-sm); background: var(--paper-sunk); overflow: hidden; }
.funnel-fill { height: 100%; background: var(--accent); border-radius: var(--radius-sm); min-width: 3px; transition: width var(--dur-state) var(--ease-out); }
.funnel-rate { font-size: var(--t-caption); color: var(--ink-faint); }

table.dtable { width: 100%; border-collapse: collapse; font-size: var(--t-secondary); }
table.dtable th, table.dtable td { text-align: left; padding: var(--sp-2) var(--sp-2); border-top: 1.5px solid var(--rule); white-space: nowrap; }
table.dtable th { color: var(--ink-faint); font-weight: 600; font-size: var(--t-caption); text-transform: uppercase; letter-spacing: 0.04em; }
table.dtable td.num, table.dtable th.num { text-align: right; font-family: var(--font-mono); }
.table-scroll { overflow-x: auto; margin-top: var(--sp-3); border-radius: var(--radius-sm); }
.table-scroll::-webkit-scrollbar { height: 6px; }

.pill {
  display: inline-flex; align-items: center; font-size: var(--t-caption); font-weight: 700;
  padding: 2px 8px; border-radius: var(--radius-pill); background: var(--paper-sunk); color: var(--ink-dim);
}
.pill--pro { background: var(--accent-tint); color: var(--accent-text); }

footer.foot {
  display: flex; align-items: center; justify-content: space-between; margin-top: var(--sp-5);
  padding-top: var(--sp-4); border-top: 1.5px solid var(--rule); gap: var(--sp-3); flex-wrap: wrap;
}
footer.foot .gen { font-size: var(--t-caption); color: var(--ink-faint); }

.skeleton { opacity: 0.5; }
@media (max-width: 520px) {
  .stat-row { gap: var(--sp-4); }
  .stat .num { font-size: 22px; }
  header.top { flex-direction: column; }
}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1>Mission Control</h1>
      <p class="sub">Clapper - private dashboard</p>
    </div>
    <div class="top-controls" id="topControls" hidden>
      <label class="toggle" id="excludeToggleWrap">
        <input type="checkbox" id="excludeToggle" checked />
        <span class="track"></span>
        <span class="label">Exclude my traffic</span>
      </label>
      <button type="button" class="btn btn--sm" id="themeBtn">Day</button>
      <button type="button" class="btn btn--text" id="signOutBtn">Sign out</button>
    </div>
  </header>

  <!-- STATE 1: login -->
  <section id="stateLogin" class="state center-card">
    <div class="mark"><span></span><span></span><span></span><span></span><span></span></div>
    <p class="lede">Enter the passphrase to see live numbers.</p>
    <form id="loginForm" style="display:flex; flex-direction:column; align-items:center; gap: var(--sp-3); width: 100%;">
      <input class="field" id="passInput" type="password" placeholder="Passphrase" autocomplete="current-password" />
      <button type="submit" class="btn btn--primary" id="loginBtn" style="min-width:240px;">Sign in</button>
    </form>
    <p class="note" id="loginNote"></p>
    <div class="err-banner" id="loginErr" hidden></div>
  </section>

  <!-- STATE 2: loading -->
  <section id="stateLoading" class="state center-card" hidden>
    <p class="lede skeleton">Loading numbers&hellip;</p>
  </section>

  <!-- STATE 3: offline/error -->
  <section id="stateOffline" class="state center-card" hidden>
    <p class="lede">Couldn't reach the server.</p>
    <p class="note" id="offlineNote">Check the connection and try again.</p>
    <button type="button" class="btn btn--primary" id="retryBtn">Try again</button>
  </section>

  <!-- STATE 4: dashboard -->
  <section id="stateDashboard" class="state" hidden>
    <div id="dashBody"></div>
    <footer class="foot">
      <span class="gen mono" id="generatedAt"></span>
    </footer>
  </section>

</div>

<script>
'use strict';
// No supabase-js, no CDN, no external script of any kind - CSP on this site
// blocks external scripts, and this page needs none: a passphrase POST and a
// couple of JSON fetches to one edge function is the entire client.
var FN_URL = 'https://sqqdivfgdfaztfzrzkhu.supabase.co/functions/v1/dashboard-api';
// The SAME public anon key already shipped in this repo's own source
// (landing/admin/index.html, landing/beacon.html) - it carries no privilege
// beyond "is a Supabase-issued JWT". It is sent as Authorization ONLY to
// satisfy the Supabase platform's own default edge-function gate, which
// checks that header for a real Supabase JWT before a request reaches this
// project's code at all - independent of anything in dashboard-api/index.ts.
// It is NOT this page's identity and dashboard-api never reads it as one:
// the real session token issued by /login lives in the JSON body of every
// request instead (see that function's own comment on this).
var ANON_KEY =
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxcWRpdmZnZGZhenRmenJ6a2h1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwMTA2NTYsImV4cCI6MjA5OTU4NjY1Nn0.MUhO3nmPg4gmQI5vLK5LGpOMIzrcA_j9ZDj8sp8ftH4';

var TOKEN_KEY = 'clapper.dashboard.token';
var TOKEN_EXP_KEY = 'clapper.dashboard.token_exp';
var THEME_KEY = 'clapper.dashboard.theme';
var EXCLUDE_KEY = 'clapper.dashboard.exclude_self';

var el = {
  topControls: document.getElementById('topControls'),
  excludeToggle: document.getElementById('excludeToggle'),
  themeBtn: document.getElementById('themeBtn'),
  signOutBtn: document.getElementById('signOutBtn'),
  login: document.getElementById('stateLogin'),
  loading: document.getElementById('stateLoading'),
  offline: document.getElementById('stateOffline'),
  offlineNote: document.getElementById('offlineNote'),
  dashboard: document.getElementById('stateDashboard'),
  dashBody: document.getElementById('dashBody'),
  generatedAt: document.getElementById('generatedAt'),
  loginForm: document.getElementById('loginForm'),
  passInput: document.getElementById('passInput'),
  loginBtn: document.getElementById('loginBtn'),
  loginNote: document.getElementById('loginNote'),
  loginErr: document.getElementById('loginErr'),
  retryBtn: document.getElementById('retryBtn'),
};

function showOnly(node) {
  for (var s of [el.login, el.loading, el.offline, el.dashboard]) s.hidden = s !== node;
  el.topControls.hidden = node !== el.dashboard;
}

/* ---------------------------------------------------------------- theme -- */
function paintTheme(theme) {
  if (theme === 'day') document.documentElement.setAttribute('data-theme', 'day');
  else document.documentElement.removeAttribute('data-theme');
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', theme === 'day' ? '#fbfaf7' : '#000000');
  el.themeBtn.textContent = theme === 'day' ? 'Night' : 'Day';
}
function currentTheme() {
  try { return localStorage.getItem(THEME_KEY) === 'day' ? 'day' : 'night'; } catch (e) { return 'night'; }
}
paintTheme(currentTheme());
el.themeBtn.addEventListener('click', function () {
  var next = currentTheme() === 'day' ? 'night' : 'day';
  try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  paintTheme(next);
});

/* -------------------------------------------------------------- session -- */
function readSession() {
  try {
    var token = sessionStorage.getItem(TOKEN_KEY);
    var exp = Number(sessionStorage.getItem(TOKEN_EXP_KEY));
    if (!token || !exp || exp * 1000 <= Date.now()) return null;
    return { token: token, exp: exp };
  } catch (e) { return null; }
}
function writeSession(token, exp) {
  try { sessionStorage.setItem(TOKEN_KEY, token); sessionStorage.setItem(TOKEN_EXP_KEY, String(exp)); } catch (e) {}
}
function clearSession() {
  try { sessionStorage.removeItem(TOKEN_KEY); sessionStorage.removeItem(TOKEN_EXP_KEY); } catch (e) {}
}

function readClientVid() {
  // Same-origin, same key the app and the landing beacon already write
  // (src/net/analytics.ts, landing/beacon.html) - reading it lets "exclude my
  // traffic" cover the browser sitting on this exact dashboard too, not just
  // whatever the owner has separately configured server-side.
  try { return localStorage.getItem('clapper.vid'); } catch (e) { return null; }
}
function readExcludeSelf() {
  try { var v = localStorage.getItem(EXCLUDE_KEY); return v === null ? true : v === '1'; } catch (e) { return true; }
}
function writeExcludeSelf(v) {
  try { localStorage.setItem(EXCLUDE_KEY, v ? '1' : '0'); } catch (e) {}
}

/* ---------------------------------------------------------------- fetch -- */
function apiPost(payload) {
  return fetch(FN_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ANON_KEY, 'apikey': ANON_KEY },
    body: JSON.stringify(payload),
  }).then(function (res) {
    return res.json().catch(function () { return {}; }).then(function (json) { return { status: res.status, json: json }; });
  });
}

var countdownTimer = null;
function startCountdown(seconds, prefix) {
  if (countdownTimer) clearInterval(countdownTimer);
  var remaining = seconds;
  el.loginBtn.disabled = true;
  function tick() {
    if (remaining <= 0) {
      clearInterval(countdownTimer);
      countdownTimer = null;
      el.loginBtn.disabled = false;
      el.loginErr.hidden = true;
      return;
    }
    el.loginErr.hidden = false;
    el.loginErr.textContent = prefix + ' Try again in ' + remaining + 's.';
    remaining--;
  }
  tick();
  countdownTimer = setInterval(tick, 1000);
}

el.loginForm.addEventListener('submit', function (e) {
  e.preventDefault();
  var pass = el.passInput.value;
  if (!pass) return;
  el.loginBtn.disabled = true;
  el.loginErr.hidden = true;
  apiPost({ action: 'login', passphrase: pass }).then(function (r) {
    if (r.status === 200 && r.json.token) {
      el.passInput.value = '';
      writeSession(r.json.token, r.json.expires_at);
      loadDashboard();
      return;
    }
    el.loginBtn.disabled = false;
    if (r.status === 429) {
      var prefix = r.json.locked ? 'Locked - too many failed attempts.' : 'Too fast.';
      startCountdown(Number(r.json.retry_after) || 10, prefix);
      return;
    }
    el.loginErr.hidden = false;
    el.loginErr.textContent = r.json.error || 'Sign-in failed.';
  }).catch(function () {
    el.loginBtn.disabled = false;
    el.loginErr.hidden = false;
    el.loginErr.textContent = "Couldn't reach the server.";
  });
});

el.signOutBtn.addEventListener('click', function () {
  clearSession();
  showOnly(el.login);
});
el.retryBtn.addEventListener('click', function () { loadDashboard(); });
el.excludeToggle.addEventListener('change', function () {
  writeExcludeSelf(el.excludeToggle.checked);
  loadDashboard();
});

function loadDashboard() {
  var session = readSession();
  if (!session) { showOnly(el.login); return; }
  showOnly(el.loading);
  el.excludeToggle.checked = readExcludeSelf();
  apiPost({
    action: 'stats',
    token: session.token,
    exclude_self: readExcludeSelf(),
    client_vid: readClientVid(),
  }).then(function (r) {
    if (r.status === 401) {
      clearSession();
      showOnly(el.login);
      el.loginErr.hidden = false;
      el.loginErr.textContent = 'Session expired - sign in again.';
      return;
    }
    if (r.status !== 200) {
      showOnly(el.offline);
      el.offlineNote.textContent = r.json.error || "The server refused that request.";
      return;
    }
    renderDashboard(r.json);
    showOnly(el.dashboard);
  }).catch(function () {
    showOnly(el.offline);
    el.offlineNote.textContent = "Check the connection and try again.";
  });
}

/* ============================================================================
   RENDERING - pure functions of whatever dashboard-api's 'stats' action
   returned. Nothing here is hardcoded; every number came back from this
   call, on this load, for this signed-in session.
   ========================================================================== */

var DAY_FMT = new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric' });
var DT_FMT = new Intl.DateTimeFormat(undefined, { dateStyle: 'medium', timeStyle: 'short' });
function fmtDay(iso) { return DAY_FMT.format(new Date(iso + 'T00:00:00Z')); }
function fmtDT(iso) { return DT_FMT.format(new Date(iso)); }
function fmtN(n) { return Number(n || 0).toLocaleString(); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function pct(a, b) { return b > 0 ? Math.round((a / b) * 1000) / 10 : 0; }

var SCREEN_LABEL = {
  home: 'Home', projects: 'Projects list', project: 'A project', shots: 'Shot list',
  cliplog: 'Clip log', rolling: 'Rolling', settings: 'Settings', account: 'Account', how_to: 'How-to guide',
};
var SECTION_LABEL = { landing: 'Landing page', articles: 'Guides', templates: 'Templates', other: 'Other' };
var FUNNEL_LABEL = {
  landing_view: 'Landed', landing_cta_click: 'Clicked into app', app_open: 'Opened the app',
  project_created: 'Created a project', roll: 'Pressed roll', cut: 'Pressed cut',
};
var EVENT_LABEL = {
  app_open: 'App opens', roll: 'Roll', cut: 'Cut', moment_marked: 'Moments marked (MARK IN/OUT)',
  tag_used: 'Quick tags used', clip_number_edited: 'Clip numbers fixed', wrap_day: 'Wrap day presses',
  project_created: 'Projects created', persist: 'Local backups written', onboarding: 'Onboarding steps seen',
  install_nudge: 'Install prompts shown', example_loaded: 'Example project loaded', error: 'Errors logged',
};

function renderRows(list, mapRow) {
  if (!list || !list.length) return '<p class="empty">Nothing yet in this window.</p>';
  return '<div class="rows">' + list.map(function (raw) {
    var r = mapRow(raw);
    return '<div class="row"><div class="k">' + esc(r.k) + (r.sub ? '<span class="sub">' + esc(r.sub) + '</span>' : '') +
      '</div><div class="v mono">' + fmtN(r.v) + (r.vsub ? '<span class="sub">' + esc(r.vsub) + '</span>' : '') + '</div></div>';
  }).join('') + '</div>';
}

/** Hand-rolled inline SVG bar chart. `series` is [{label, value}], values
 * scaled to the series' own max. No axis library, no canvas dependency - a
 * handful of <rect>s and <text>s is the whole chart. */
function svgBars(series, opts) {
  opts = opts || {};
  var w = opts.width || 640, h = opts.height || 96, pad = 18;
  if (!series.length) return '<p class="empty">No days in this window yet.</p>';
  var max = 1;
  for (var mi = 0; mi < series.length; mi++) max = Math.max(max, Number(series[mi].value) || 0);
  var barW = (w - pad) / series.length;
  var gap = Math.min(6, barW * 0.25);
  var bars = series.map(function (s, i) {
    var v = Number(s.value) || 0;
    var bh = Math.max(2, Math.round((v / max) * (h - 20)));
    var x = pad + i * barW;
    var y = h - 20 - bh;
    var showEvery = series.length > 14 ? Math.ceil(series.length / 10) : 1;
    var label = i % showEvery === 0 ? esc(fmtDay(s.day)) : '';
    return '<rect class="bar" x="' + (x + gap / 2).toFixed(1) + '" y="' + y + '" width="' + Math.max(1, barW - gap).toFixed(1) +
      '" height="' + bh + '"><title>' + esc(fmtDay(s.day)) + ': ' + fmtN(s.value) + '</title></rect>' +
      (label ? '<text class="axis-label" x="' + (x + barW / 2).toFixed(1) + '" y="' + (h - 6) + '" text-anchor="middle">' + label + '</text>' : '');
  }).join('');
  return '<svg class="chart-svg" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" role="img">' + bars + '</svg>';
}
function panelTraffic(t, meta) {
  var uniqueNote = 'Unique visitors only count from <strong>' + fmtDay(meta.vid_cutoff.slice(0, 10)) +
    '</strong> onward - the anonymous visitor id (<code>vid</code>) is absent on every row before that date, so it reads honestly as zero rather than a misleading ramp. ' +
    'Clearing storage or a private window mints a fresh id, so uniques run HIGH and returning visitors run LOW.';

  var guideRows = t.guides.map(function (g) { return { k: '/articles/' + g.slug + '/', v: g.views, vsub: g.unique + ' unique' }; });
  var templateRows = t.templates.map(function (g) { return { k: '/templates/' + g.slug + '/', v: g.views, vsub: g.unique + ' unique' }; });
  var sectionRows = t.by_section.map(function (s) { return { k: SECTION_LABEL[s.section] || s.section, v: s.views, vsub: s.unique + ' unique' }; });

  return '<div class="card">' +
    '<h2>Traffic</h2>' +
    '<div class="stat-row">' +
      '<div class="stat"><div class="num mono">' + fmtN(t.total_views) + '</div><div class="label">landing views</div></div>' +
      '<div class="stat"><div class="num mono">' + fmtN(t.unique_visitors) + '</div><div class="label">unique visitors (since ' + fmtDay(meta.vid_cutoff.slice(0, 10)) + ')</div></div>' +
      '<div class="stat"><div class="num mono">' + fmtN(t.cta_clicks) + '</div><div class="label">clicked into the app</div></div>' +
    '</div>' +
    svgBars(t.by_day.map(function (d) { return { day: d.day, value: d.views }; }), {}) +
    '<h3 class="sub-h">By section</h3>' + renderRows(sectionRows, function (r) { return r; }) +
    '<h3 class="sub-h">The nine guides</h3>' + renderRows(guideRows, function (r) { return r; }) +
    '<h3 class="sub-h">The five templates</h3>' + renderRows(templateRows, function (r) { return r; }) +
    '<p class="foot-note">' + uniqueNote + '</p>' +
  '</div>';
}

function panelFunnel(f) {
  var first = f.stages[0] ? f.stages[0].unique : 0;
  var rowsHtml = f.stages.map(function (s, i) {
    var prev = i > 0 ? f.stages[i - 1].unique : s.unique;
    var width = first > 0 ? Math.max(2, Math.round((s.unique / first) * 100)) : 0;
    var rate = i > 0 ? pct(s.unique, prev) + '% of previous, ' + pct(s.unique, first) + '% of landed' : '100% (start of funnel)';
    return '<div class="funnel-row">' +
      '<div class="lbl"><span class="name">' + esc(FUNNEL_LABEL[s.name] || s.name) + '</span><span class="val mono">' + fmtN(s.unique) + '</span></div>' +
      '<div class="funnel-track"><div class="funnel-fill" style="width:' + width + '%"></div></div>' +
      '<div class="funnel-rate">' + rate + '</div>' +
    '</div>';
  }).join('');
  return '<div class="card"><h2>Funnel</h2><div class="funnel">' + rowsHtml + '</div>' +
    '<p class="foot-note">Counted by distinct visitor id, so it only reflects visits since ' +
    '<strong>vid</strong> began recording. Every stage before that date reads as zero, not as no traffic.</p>' +
  '</div>';
}

function panelAppUsage(a) {
  var eventRows = a.event_counts.map(function (e) { return { k: EVENT_LABEL[e.name] || e.name, v: e.count }; });
  var screenRows = a.screens.map(function (s) { return { k: SCREEN_LABEL[s.screen] || s.screen, v: s.count }; });
  var endRows = a.session_ends.by_screen.map(function (s) { return { k: SCREEN_LABEL[s.screen] || s.screen, v: s.count }; });
  return '<div class="card">' +
    '<h2>App usage</h2>' +
    '<h3 class="sub-h">Events</h3>' + renderRows(eventRows, function (r) { return r; }) +
    '<h3 class="sub-h">Screens reached</h3>' + renderRows(screenRows, function (r) { return r; }) +
    '<h3 class="sub-h">Where sessions end</h3>' +
    '<div class="stat-row" style="margin-bottom:var(--sp-3)"><div class="stat"><div class="num mono">' + fmtN(a.session_ends.total) + '</div><div class="label">times the app went to background</div></div></div>' +
    renderRows(endRows, function (r) { return r; }) +
    '<p class="foot-note"><strong>Not a session count.</strong> On set the phone locks between takes constantly, so one real sitting can appear here several times. Read this only as "which screen tends to be up when the app leaves the foreground" - never total it as "how many sessions happened".</p>' +
  '</div>';
}

function panelLlm(l) {
  var byModelRows = l.by_model.map(function (m) {
    return { k: m.model, v: m.calls, sub: fmtN(m.ok) + ' ok, ' + fmtN(m.failed) + ' failed, ' + fmtN(m.rate_limited) + ' rate-limited', vsub: fmtN(m.prompt_tokens + m.completion_tokens) + ' tokens' };
  });
  var byUserRows = l.by_user.slice(0, 25).map(function (u) {
    return { k: u.email || (u.user_id === 'anon' ? 'Unattributed' : u.user_id), v: u.calls, vsub: fmtN(u.prompt_tokens + u.completion_tokens) + ' tokens' };
  });
  return '<div class="card">' +
    '<h2>LLM (Script Mode)</h2>' +
    '<div class="stat-row">' +
      '<div class="stat"><div class="num mono">' + fmtN(l.totals.calls) + '</div><div class="label">requests</div></div>' +
      '<div class="stat"><div class="num mono">' + fmtN(l.totals.ok) + '</div><div class="label">succeeded</div></div>' +
      '<div class="stat"><div class="num mono">' + fmtN(l.totals.failed) + '</div><div class="label">failed</div></div>' +
      '<div class="stat"><div class="num mono">' + fmtN(l.totals.rate_limited) + '</div><div class="label">rate-limited</div></div>' +
    '</div>' +
    '<div class="stat-row" style="margin-top:var(--sp-3)">' +
      '<div class="stat"><div class="num mono">' + fmtN(l.totals.prompt_tokens) + '</div><div class="label">prompt tokens</div></div>' +
      '<div class="stat"><div class="num mono">' + fmtN(l.totals.completion_tokens) + '</div><div class="label">completion tokens</div></div>' +
    '</div>' +
    svgBars(l.by_day.map(function (d) { return { day: d.day, value: d.calls }; }), {}) +
    '<h3 class="sub-h">By model</h3>' + renderRows(byModelRows, function (r) { return r; }) +
    '<h3 class="sub-h">By user (top 25 by requests)</h3>' + renderRows(byUserRows, function (r) { return r; }) +
    '<p class="foot-note">Counts every Groq request, including ones that failed - a 429 or a 502 still costs input tokens and still counts against the rate limit, so a quiet "successes" number on an expensive day is exactly the lie this meter exists to catch.</p>' +
  '</div>';
}

function panelUsers(u) {
  var rows = u.rows.slice(0, 200).map(function (r) {
    return '<tr><td>' + esc(r.email || r.user_id) + '</td>' +
      '<td>' + esc(fmtDay(r.created_at.slice(0, 10))) + '</td>' +
      '<td>' + (r.is_pro ? '<span class="pill pill--pro">PRO</span>' : '<span class="pill">free</span>') + '</td>' +
      '<td>' + esc(r.pro_until ? fmtDay(r.pro_until.slice(0, 10)) : '–') + '</td>' +
      '<td class="num">' + fmtN(r.llm_calls) + '</td>' +
      '<td class="num">' + fmtN(r.llm_prompt_tokens + r.llm_completion_tokens) + '</td>' +
      '<td><button type="button" class="btn btn--sm" disabled title="' + esc(u.suspend_unavailable_reason) + '">Suspend</button></td></tr>';
  }).join('');
  return '<div class="card">' +
    '<h2>Users</h2>' +
    '<div class="stat-row">' +
      '<div class="stat"><div class="num mono">' + fmtN(u.total) + '</div><div class="label">accounts</div></div>' +
      '<div class="stat"><div class="num mono">' + fmtN(u.pro) + '</div><div class="label">pro</div></div>' +
      '<div class="stat"><div class="num mono">' + fmtN(u.free) + '</div><div class="label">free</div></div>' +
    '</div>' +
    (u.rows.length
      ? '<div class="table-scroll"><table class="dtable"><thead><tr><th>Email</th><th>Created</th><th>Plan</th><th>Pro until</th><th class="num">LLM calls</th><th class="num">Tokens</th><th>&nbsp;</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
      : '<p class="empty">No accounts yet.</p>') +
    (u.rows.length > 200 ? '<p class="foot-note">Showing the first 200 of ' + fmtN(u.rows.length) + '.</p>' : '') +
    '<p class="foot-note"><strong>Suspend / unsuspend is disabled on purpose.</strong> ' + esc(u.suspend_unavailable_reason) + '</p>' +
  '</div>';
}

function renderDashboard(data) {
  var meta = data.meta;
  var excludeBits = [];
  if (meta.exclude_self) {
    excludeBits.push('<strong>' + fmtN(meta.excluded_rows_count) + '</strong> row(s) matching your own traffic excluded from every number below.');
    if (!meta.owner_user_id_configured) excludeBits.push('Owner user_id not configured (see dashboard-api/index.ts footer for the SQL) - only the current browser\'s vid and any configured excluded vids are being filtered.');
    if (!meta.excluded_vids_configured) excludeBits.push('No excluded-vid list configured - only the owner user_id and this browser\'s own vid are being filtered.');
  } else {
    excludeBits.push('Exclusion is OFF - every row, including your own testing, is counted below.');
  }

  // Global honesty banner - covers EVERY panel below, not just Traffic. Every
  // count and chart on this page (Traffic, Funnel, App usage, LLM) is already
  // filtered server-side to dev_gate_cutoff; this is where that filter and
  // what it silently drops gets said out loud, once, in the one place a
  // reader can't miss it before scrolling into any specific panel.
  var cutoffBanner = '<div class="banner">' +
    'Every number on this page (Traffic, Funnel, App usage, LLM) counts only events from <strong>' + esc(fmtDay(meta.dev_gate_cutoff.slice(0, 10))) + '</strong> onward. ' +
    '<strong>' + fmtN(meta.pre_cutoff_events_excluded) + '</strong> earlier event(s) are excluded: a hostname gate that fixed real vs. dev-server traffic landed 20 Aug (commit <code>92c31ac</code>), and roughly 4 in 5 events recorded before it were automated dev traffic, not real use - see src/net/analytics.ts. They are dropped, not charted as if real.' +
  '</div>';

  el.dashBody.innerHTML =
    cutoffBanner +
    '<div class="banner">' + excludeBits.join(' ') + '</div>' +
    (meta.events_truncated ? '<div class="banner">Event fetch hit its row cap (' + fmtN(meta.events_fetched) + ' rows) - counts below may undercount. Raise EVENTS_ROW_CAP in dashboard-api/index.ts.</div>' : '') +
    panelTraffic(data.traffic, meta) +
    panelFunnel(data.funnel) +
    panelAppUsage(data.app_usage) +
    panelLlm(data.llm) +
    panelUsers(data.users);

  el.generatedAt.textContent = 'Updated ' + fmtDT(meta.generated_at);
}

/* Testability hook - lets the populated dashboard be screenshotted with
 * fixture JSON, no live token or passphrase involved, same pattern as
 * landing/admin/index.html's own __clapperAdmin hook. */
window.__dashboard = {
  renderDashboard: renderDashboard,
  showOnly: showOnly,
  el: el,
  showFixture: function (data) {
    renderDashboard(data);
    el.topControls.hidden = false;
    showOnly(el.dashboard);
  },
};

/* ------------------------------------------------------------------ boot */
el.excludeToggle.checked = readExcludeSelf();
loadDashboard();
</script>
</body>
