  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Is Clapper free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, Clapper is free to start. You sign in with your Google account, and every free account gets 3 podcast rolls, 1 Script Mode breakdown, 3 XML exports for Premiere or DaVinci Resolve, 5 PDF call sheets and 5 CSV exports. Logging takes is unlimited and always free."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need to install anything?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Clapper is a phone-first web app (PWA) that opens right in your browser on iOS or Android. There is nothing to download from an app store."
          }
        },
        {
          "@type": "Question",
          "name": "Does Clapper work offline?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Clapper works offline on set, so it keeps logging takes even with no signal."
          }
        },
        {
          "@type": "Question",
          "name": "Can I export to Premiere?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. At wrap, Clapper exports a Premiere-ready XML with your takes named and markers placed at your taps, plus a PDF shot log with GOLD takes highlighted and a CSV of every take, tag, and timecode. They are plain files your tools already read, with nothing proprietary."
          }
        },
        {
          "@type": "Question",
          "name": "Does Clapper number camera clips to match my footage?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Pick your camera body (Sony, iPhone, RED, ARRI, GoPro) and Clapper numbers clips the way that camera does, so the log matches the cards with no drift or off-by-one. Clip patterns are editable if your camera is not listed."
          }
        },
        {
          "@type": "Question",
          "name": "What is a TCR or continuity sheet, and does Clapper make one?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A TCR (timecode report) or continuity sheet is a take-by-take record of what happened during each take with the timecode for each moment. Clapper builds one as you tap during the take, then exports it as a PDF shot log and a CSV of every take, tag, and timecode."
          }
        }
      ]
    }
  </script>
