# Keeps the Supabase free-tier project awake. Free projects auto-PAUSE after
# ~7 days of no activity, which would take down auth + Script Mode + sync.
# This inserts one lightweight `keepwarm` analytics event every 3 days — a real
# DB write (anon insert is allowed by RLS), which resets the inactivity timer.
#
# The anon key is a PUBLIC client key by design (it already ships in the app
# bundle); it is safe to inline. The service-role key is NOT here.
#
# NOTE: GitHub only runs scheduled workflows from the repo's DEFAULT branch,
# so this file must be committed to `main` to take effect.
name: keep-supabase-warm

on:
  schedule:
    - cron: '17 6 */3 * *' # 06:17 UTC, every 3rd day — well inside the 7-day pause window
  workflow_dispatch: {} # allow a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Insert a keepwarm heartbeat event
        run: |
          set -euo pipefail
          URL="https://sqqdivfgdfaztfzrzkhu.supabase.co/rest/v1/events"
          ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxcWRpdmZnZGZhenRmenJ6a2h1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwMTA2NTYsImV4cCI6MjA5OTU4NjY1Nn0.MUhO3nmPg4gmQI5vLK5LGpOMIzrcA_j9ZDj8sp8ftH4"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$URL" \
            -H "apikey: $ANON" \
            -H "Authorization: Bearer $ANON" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"name":"keepwarm","props":{"src":"gh-action"}}')
          echo "Supabase responded: $code"
          # 2xx = insert accepted. Anything else still counts as project activity,
          # but fail loudly so a broken key/URL surfaces instead of silently rotting.
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Unexpected status $code from Supabase keepwarm ping"
            exit 1
          fi
